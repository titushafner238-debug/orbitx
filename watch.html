<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.hero{min-height:70vh;background-size:cover;background-position:center;position:relative}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080808 10%,rgba(8,8,8,.78) 50%,rgba(8,8,8,.25)),linear-gradient(0deg,#080808,transparent 50%)}.content{position:relative;z-index:1;max-width:650px;padding:16vh 7vw}.back{color:#bbb;text-decoration:none}.title{font-size:60px;margin:30px 0 15px}.meta{color:#bbb;margin-bottom:20px}.desc{font-size:18px;line-height:1.7;color:#ddd}.buttons{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap}.btn{padding:13px 20px;background:#fff;color:#000;border-radius:6px;text-decoration:none;font-weight:bold}.btn.alt{background:#292929;color:#fff}main{max-width:1100px;margin:auto;padding:35px 6vw}video{width:100%;max-height:70vh;background:#000}.trailer{margin-top:25px}</style></head><body><section class="hero" id="hero"><div class="shade"></div><div class="content"><a class="back" href="/">← Back to ORBIT</a><h1 class="title" id="title">Loading…</h1><div class="meta" id="meta"></div><p class="desc" id="desc"></p><div class="buttons" id="buttons"></div></div></section><main id="media"></main><script>(async()=>{const slug=new URLSearchParams(location.search).get("slug");if(!slug)return;const r=await fetch("/api/public/content?q="+encodeURIComponent(slug));const d=await r.json();const x=(d.content||[]).find(i=>i.slug===slug);if(!x){document.getElementById("title").textContent="Not found";return}document.title="ORBIT - "+x.title;document.getElementById("title").textContent=x.title;document.getElementById("desc").textContent=x.description||"";document.getElementById("meta").textContent=[x.year,x.rating,x.runtime_minutes?x.runtime_minutes+" min":""].filter(Boolean).join(" · ");if(x.backdrop_url)document.getElementById("hero").style.backgroundImage='url("'+x.backdrop_url+'")';const b=document.getElementById("buttons");if(x.trailer_url)b.innerHTML='<a class="btn alt" target="_blank" href="'+x.trailer_url+'">Trailer</a>';if(x.video_url){document.getElementById("media").innerHTML='<h2>Watch</h2><video controls playsinline src="'+x.video_url+'"></video>'}})();</script></body></html>
