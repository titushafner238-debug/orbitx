<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — ORBIT X</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}header{min-height:72px;background:#0b0b0b;border-bottom:1px solid #242424;display:flex;align-items:center;gap:32px;padding:0 38px;position:sticky;top:0;z-index:10}.logo{font-size:27px;font-weight:900;letter-spacing:4px;white-space:nowrap}.main-nav{display:flex;align-items:center;gap:24px}.main-nav a{color:#bbb;font-size:15px}.main-nav a:hover,.main-nav a.active{color:#fff}.search-page-button{display:inline-flex;align-items:center;gap:8px;color:#fff!important;border:1px solid #444;border-radius:7px;padding:9px 12px;background:#202020}.search-glass{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-radius:50%;position:relative}.search-glass:after{content:"";position:absolute;width:6px;height:2px;background:currentColor;right:-5px;bottom:-3px;transform:rotate(45deg)}main{max-width:1500px;margin:0 auto;padding:28px 48px 70px}.back-row{margin-bottom:26px}.back-button{border:0;background:transparent;color:#eee;cursor:pointer;font-size:16px;padding:10px 12px 10px 0;display:inline-flex;align-items:center;gap:10px}.back-button:hover{color:#aaa}.back-arrow{font-size:27px;line-height:1}.page-title{font-size:36px;letter-spacing:.2px;margin-bottom:22px}.search-field{width:100%;height:58px;display:flex;align-items:center;gap:14px;background:#161616;border:1px solid #444;border-radius:8px;padding:0 18px;margin-bottom:38px}.search-field:focus-within{border-color:#aaa}.search-field input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:18px}.search-field input::placeholder{color:#858585}.collections-title{font-size:24px;margin-bottom:18px}.collections-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.collection-tile{position:relative;min-height:190px;border:1px solid #333;border-radius:10px;overflow:hidden;text-align:left;color:#fff;cursor:pointer;background:#171717;transition:transform .18s,border-color .18s}.collection-tile:hover{transform:translateY(-4px);border-color:#777}.collection-art{position:absolute;inset:0;background:linear-gradient(110deg,rgba(0,0,0,.9),rgba(0,0,0,.12)),linear-gradient(135deg,#343434,#0b0b0b)}.collection-tile[data-collection="chaplin"] .collection-art{background:linear-gradient(110deg,rgba(0,0,0,.82),rgba(0,0,0,.08)),linear-gradient(135deg,#777,#171717)}.collection-tile[data-collection="christmas"] .collection-art{background:linear-gradient(110deg,rgba(0,0,0,.8),rgba(0,0,0,.1)),linear-gradient(135deg,#28513d,#101b15)}.collection-tile[data-collection="halloween"] .collection-art{background:linear-gradient(110deg,rgba(0,0,0,.82),rgba(0,0,0,.1)),linear-gradient(135deg,#7b3b13,#170d08)}.collection-copy{position:absolute;left:22px;right:18px;bottom:20px}.collection-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ddd;margin-bottom:8px}.collection-copy h3{font-size:25px}.collection-copy p{color:#d0d0d0;font-size:13px;margin-top:7px}.results-heading{font-size:24px;margin:4px 0 18px}.movie-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.movie-card{min-width:0;background:#151515;border-radius:8px;overflow:hidden;transition:transform .18s}.movie-card:hover{transform:translateY(-4px)}.poster{height:260px;background:linear-gradient(145deg,#292929,#101010);display:flex;align-items:center;justify-content:center;color:#777;font-size:12px}.poster img{width:100%;height:100%;object-fit:cover;display:block}.movie-info{padding:13px}.movie-title{font-size:15px;font-weight:bold;line-height:1.35;margin-bottom:7px}.movie-meta{font-size:12px;color:#888}.watch-button{display:block;margin-top:12px;padding:9px;background:#fff;color:#000;text-align:center;border-radius:4px;font-size:13px;font-weight:bold}.empty-state{padding:32px 4px;color:#888;line-height:1.6}.hidden{display:none!important}footer{border-top:1px solid #222;padding:28px;text-align:center;color:#666;font-size:13px}@media(max-width:900px){header{padding:14px 20px;gap:18px;flex-wrap:wrap}.main-nav{gap:14px;flex-wrap:wrap}main{padding:24px 22px 50px}.movie-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.poster{height:220px}}@media(max-width:600px){.logo{font-size:22px}.main-nav{width:100%;justify-content:space-between}.main-nav a{font-size:13px}main{padding:20px 14px 40px}.page-title{font-size:30px}.collections-grid{grid-template-columns:1fr;gap:12px}.collection-tile{min-height:145px}.movie-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.poster{height:200px}.search-field{height:52px;margin-bottom:28px}}
</style>
</head>
<body>
<header>
<a href="/" class="logo">ORBIT X</a>
<nav class="main-nav" aria-label="Main navigation">
<a href="/">Home</a><a href="/movies.html">Movies</a><a href="/tv.html">TV</a><a href="/search.html" class="search-page-button active" aria-current="page"><span class="search-glass" aria-hidden="true"></span><span>Search</span></a>
</nav>
</header>
<main>
<div class="back-row"><button id="backButton" class="back-button" type="button"><span class="back-arrow" aria-hidden="true">←</span><span>Back</span></button></div>
<h1 class="page-title">Search ORBIT X</h1>
<label class="search-field"><span class="search-glass" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="Search movies and TV shows" autocomplete="off" aria-label="Search movies and TV shows"></label>
<section id="collectionsSection">
<h2 class="collections-title">Collections</h2>
<div class="collections-grid">
<button class="collection-tile" type="button" data-collection="chaplin"><span class="collection-art"></span><span class="collection-copy"><span class="collection-eyebrow">ORBIT X Collection</span><h3>Charlie Chaplin</h3><p>Silent-film classics and comedy.</p></span></button>
<button class="collection-tile" type="button" data-collection="christmas"><span class="collection-art"></span><span class="collection-copy"><span class="collection-eyebrow">Seasonal Collection</span><h3>Christmas Movies</h3><p>Holiday favorites for movie night.</p></span></button>
<button class="collection-tile" type="button" data-collection="halloween"><span class="collection-art"></span><span class="collection-copy"><span class="collection-eyebrow">Seasonal Collection</span><h3>Halloween Movies</h3><p>Spooky classics and Halloween picks.</p></span></button>
<button class="collection-tile" type="button" data-collection="tarzan"><span class="collection-art"></span><span class="collection-copy"><span class="collection-eyebrow">ORBIT X Collection</span><h3>Tarzan Collection</h3><p>Jungle adventures and classic Tarzan serials.</p></span></button>
</div>
</section>
<section id="resultsSection" class="hidden" aria-live="polite"><h2 id="resultsHeading" class="results-heading">Search results</h2><div id="resultsGrid" class="movie-grid"></div><p id="resultsEmpty" class="empty-state hidden"></p></section>
<section id="collectionSection" class="hidden" aria-live="polite"><h2 id="collectionHeading" class="results-heading"></h2><div id="collectionGrid" class="movie-grid"></div><p id="collectionEmpty" class="empty-state hidden"></p></section>
</main>
<footer>ORBIT X — Free Entertainment</footer>
<script>
(()=> {
 const $=id=>document.getElementById(id), input=$("searchInput");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
 let items=[];
 const collectionInfo={
  chaplin:{title:"Charlie Chaplin",match:i=>/charlie chaplin|the vagabond|the floorwalker|the rink|burlesque on carmen|shanghaied|the cure|the count|tillie's punctured|tillie.s punctured|one a\.m\.|kid auto races|making a living|mabel.s strange predicament|the good for nothing|a fair exchange/i.test(i.title||"")},
  christmas:{title:"Christmas Movies",match:i=>/christmas|santa claus|santa's|santa’s|holiday|winter wonderland|silent night/i.test([i.title,i.description,i.genres].filter(Boolean).join(" "))},
  halloween:{title:"Halloween Movies",match:i=>/halloween|haunted|ghost|witch|monster|vampire|frankenstein|dracula|horror|spooky/i.test([i.title,i.description,i.genres].filter(Boolean).join(" "))},
  tarzan:{title:"Tarzan Collection",match:i=>/tarzan/i.test([i.title,i.description].filter(Boolean).join(" "))}
 };
 function card(i){const meta=[i.type==="show"?"TV Show":"Movie",i.year].filter(Boolean).join(" · ");return '<article class="movie-card"><a href="/watch.html?slug='+encodeURIComponent(i.slug)+'"><div class="poster">'+(i.poster_url?'<img src="'+esc(i.poster_url)+'" alt="'+esc(i.title)+'" loading="lazy" onerror="this.remove()">':'ORBIT X')+'</div><div class="movie-info"><div class="movie-title">'+esc(i.title)+'</div><div class="movie-meta">'+esc(meta)+'</div><span class="watch-button">View title</span></div></a></article>'}
 function showResults(list){$("collectionsSection").classList.add("hidden");$("collectionSection").classList.add("hidden");$("resultsSection").classList.remove("hidden");$("resultsHeading").textContent="Search results";$("resultsGrid").innerHTML=list.slice(0,60).map(card).join("");$("resultsEmpty").classList.toggle("hidden",list.length>0);$("resultsEmpty").textContent=list.length?"":"No matching movies or TV shows found."}
 function showCollection(key){const info=collectionInfo[key];if(!info)return;input.value="";$("resultsSection").classList.add("hidden");$("collectionsSection").classList.add("hidden");$("collectionSection").classList.remove("hidden");$("collectionHeading").textContent=info.title;const list=items.filter(info.match);$("collectionGrid").innerHTML=list.map(card).join("");$("collectionEmpty").classList.toggle("hidden",list.length>0);$("collectionEmpty").textContent=list.length?"":"More titles coming soon. This collection will fill up as ORBIT X adds movies.";history.replaceState(null,"","/search.html?collection="+encodeURIComponent(key))}
 input.addEventListener("input",()=>{const q=input.value.trim().toLowerCase();if(!q){$("resultsSection").classList.add("hidden");$("collectionSection").classList.add("hidden");$("collectionsSection").classList.remove("hidden");history.replaceState(null,"","/search.html");return}showResults(items.filter(i=>[i.title,i.description,i.genres,i.year].filter(Boolean).join(" ").toLowerCase().includes(q)))});
 document.querySelectorAll("[data-collection]").forEach(b=>b.addEventListener("click",()=>showCollection(b.dataset.collection)));
 $("backButton").addEventListener("click",()=>{const from=sessionStorage.getItem("orbitxSearchFrom");if(from&&from!=="/search.html"&&!from.startsWith("/search.html?")){sessionStorage.removeItem("orbitxSearchFrom");location.href=from;return}if(document.referrer&&new URL(document.referrer).origin===location.origin&&new URL(document.referrer).pathname!=="/search.html"){location.href=document.referrer;return}location.href="/"});
 fetch("/api/public/content",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{items=d.content||[];const params=new URLSearchParams(location.search);if(params.get("collection"))showCollection(params.get("collection"));else if(params.get("q")){input.value=params.get("q");input.dispatchEvent(new Event("input"))}}).catch(()=>{items=[];});
})();
</script>
</body>
</html>
