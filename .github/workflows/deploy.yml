name: Deploy Orbit X

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker
        run: wrangler deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1e1ddd8eff837c1f4f558c0c7502564
      - name: Retrieve YouTube titles for catalog
        run: |
          node <<'NODE'
          const ids = [
            'JSj1mZ9-CAM','dAeVyZieW1U','f-vk0G5EWrk','cs6UK61vYqI','--ZAVwdQvoo','rjF63_-1548',
            't_wJ7p1d7kU','CLLYrGrcAso','7VIB6D3SwKk','7vodgxAiqc4','SlUnAOFcmu4','IPaLgJag3No',
            'L3F-9ZfXl_M','V1Nlk_pBqfc','L9YVnTGxPHs','saQOrNranuc','-zvhMjGWTUI','T-a8NiBvSs4',
            'sFUc5KMYvB0','zNLTmEdDAPA','tKr9udblGv0','7SIY5LrE3Ls','r86pYHAWwSs','88gild2bj4A',
            'usJZRDI_g00','TbiQYkCQb6c','ea5vNEO6Tew','S5DwXvxAMFs','QnxjFNkEOQg','bDUouOsYaTM',
            'J3AnhYnfY_U','ZcGHSZxrQnY','ijDfbGEfEts','mMwIUGYIyx0','OnEAbR7n1sw','lGPZTq7kxQI'
          ];
          (async () => {
            for (const id of ids) {
              try {
                const url = 'https://www.youtube.com/watch?v=' + id;
                const res = await fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(url) + '&format=json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const d = await res.json();
                console.log('ORBIT_VIDEO_METADATA ' + JSON.stringify({id, title:d.title || '', author:d.author_name || '', thumbnail:d.thumbnail_url || ''}));
              } catch (e) { console.log('ORBIT_VIDEO_METADATA ' + JSON.stringify({id,error:e.message})); }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1e1ddd8eff837c1f4f558c0c7502564
